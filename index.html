<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>SITREP Manaus/RMM — Mapa Operacional</title>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.css">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/leaflet.markercluster/1.5.3/MarkerCluster.css">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/leaflet.markercluster/1.5.3/MarkerCluster.Default.css">
<style>
:root{
  --bg0:#04140b; --bg1:#020a06; --green:#57e08a; --dim:#84ae93; --white:#eef6ef;
  --red:#ff4d5e; --amber:#f2b32c; --blue:#5cc8ff; --line:rgba(90,220,140,.28); --panel:rgba(6,20,12,.92);
}
*{box-sizing:border-box}
html,body{margin:0;height:100%;background:var(--bg1);color:var(--white);
  font-family:'DejaVu Sans Mono',ui-monospace,'Roboto Mono',monospace}
#app{display:flex;flex-direction:column;height:100%}
header{display:flex;align-items:center;gap:20px;padding:12px 22px;border-bottom:1px solid var(--line);
  background:linear-gradient(180deg,#06180d,#04120a)}
header .brand{font-weight:bold;font-size:22px;letter-spacing:.14em;color:#fff}
header .brand .g{color:var(--green)}
header .meta{color:var(--dim);font-size:13px;letter-spacing:.1em}
header .spacer{flex:1}
header .attn{border:1px solid var(--green);color:var(--green);font-size:13px;font-weight:bold;
  padding:6px 12px;letter-spacing:.14em}
#main{flex:1;position:relative;min-height:0}
#map{position:absolute;inset:0;background:#0a1a10}
.panel{position:absolute;top:16px;left:16px;z-index:1000;width:320px;max-width:44vw;
  background:var(--panel);border:1px solid var(--line);backdrop-filter:blur(2px);
  padding:16px 18px;box-shadow:0 8px 30px rgba(0,0,0,.5)}
.panel h1{font-size:15px;letter-spacing:.12em;color:var(--green);margin:0 0 8px}
.panel .note{font-size:12.5px;color:var(--dim);line-height:1.5;margin:8px 0}
.counts{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin:12px 0}
.cbox{border:1px solid var(--line);padding:8px 10px}
.cbox .n{font-size:24px;font-weight:bold} .cbox .l{font-size:11px;color:var(--dim);letter-spacing:.08em}
.legend{display:flex;flex-direction:column;gap:7px;margin-top:10px}
.lg{display:flex;align-items:center;gap:10px;font-size:13px}
.lg .sw{width:16px;height:16px;border-radius:50%;box-shadow:0 0 8px currentColor;flex:0 0 auto}
.lg .c{color:var(--dim)}
.btns{display:flex;gap:8px;margin-top:14px;flex-wrap:wrap}
.btn{background:rgba(87,224,138,.10);border:1px solid var(--green);color:var(--green);
  font-family:inherit;font-size:12.5px;font-weight:bold;letter-spacing:.06em;padding:9px 12px;cursor:pointer}
.btn:hover{background:rgba(87,224,138,.2)}
.btn.sec{border-color:var(--line);color:var(--dim)}
.status{font-size:12px;color:var(--amber);margin-top:10px;min-height:16px}
.attrib{position:absolute;bottom:6px;right:8px;z-index:1000;font-size:11px;color:#cfe;
  background:rgba(3,10,6,.6);padding:2px 7px;border-radius:3px}
/* markers */
.pin{display:block;width:20px;height:20px;position:relative}
.pin i{position:absolute;left:50%;top:50%;width:14px;height:14px;transform:translate(-50%,-50%);
  border-radius:50%;background:var(--c);box-shadow:0 0 10px var(--c);border:2px solid rgba(255,255,255,.85)}
.pin b{position:absolute;left:50%;top:50%;width:30px;height:30px;transform:translate(-50%,-50%);
  border-radius:50%;border:2px solid var(--c);opacity:.45}
/* leaflet popup theme */
.leaflet-popup-content-wrapper{background:#06180d;color:var(--white);border:1px solid var(--line);border-radius:6px}
.leaflet-popup-tip{background:#06180d;border:1px solid var(--line)}
.leaflet-popup-content{margin:14px 16px;font-size:13.5px;line-height:1.5;max-width:300px}
.pop .t{font-weight:bold;color:#fff;font-size:14.5px;line-height:1.3}
.pop .m{color:var(--dim);font-size:12px;margin:6px 0}
.pop .crit{display:inline-block;font-weight:bold;font-size:11px;letter-spacing:.08em;padding:2px 8px;border:1px solid;margin-right:6px}
.pop .aprox{color:var(--amber);font-weight:bold;font-size:11px}
.pop a{color:var(--green)}
.leaflet-container{font-family:inherit}
.marker-cluster{background:rgba(49,200,95,.25)}
.marker-cluster div{background:rgba(6,24,13,.9);color:var(--green);font-weight:bold;border:1px solid var(--green)}
.leaflet-bar a{background:#06180d;color:var(--green);border-color:var(--line)}
.leaflet-bar a:hover{background:#0b2a18}
@media(max-width:640px){.panel{width:auto;left:8px;right:8px;max-width:none;top:8px}}
</style>
</head>
<body>
<div id="app">
  <header>
    <div>
      <div class="brand">SITREP <span class="g">MANAUS/RMM</span> · MAPA OPERACIONAL</div>
      <div class="meta" id="hmeta"></div>
    </div>
    <div class="spacer"></div>
    <div class="attn">ATENÇÃO: LOCALIZADA</div>
  </header>
  <div id="main">
    <div id="map"></div>
    <div class="panel">
      <h1>PAINEL OPERACIONAL</h1>
      <div class="note" id="pnote"></div>
      <div class="counts" id="counts"></div>
      <div class="legend" id="legend"></div>
      <div class="btns">
        <button class="btn" id="btnFit">ENQUADRAR TUDO</button>
        <button class="btn sec" id="btnGeo">ATUALIZAR VIA NOMINATIM</button>
      </div>
      <div class="status" id="status"></div>
      <div class="note" style="margin-top:10px">Geocodificação: OpenStreetMap / Nominatim · Tiles: OpenStreetMap.<br><b>© OpenStreetMap contributors</b></div>
    </div>
    <div class="attrib">© OpenStreetMap contributors</div>
  </div>
</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/leaflet.markercluster/1.5.3/leaflet.markercluster.js"></script>
<script src="data/events.js"></script>
<script src="data/geocoding-cache.js"></script>
<script>
const CRIT = {
  ALTO:      {cor:"#ff4d5e", rot:"NÍVEL ALTO",  desc:"violência letal / vítimas fatais"},
  MEDIO:     {cor:"#f2b32c", rot:"NÍVEL MÉDIO", desc:"sinistralidade / múltiplas vítimas"},
  BAIXO:     {cor:"#5cc8ff", rot:"NÍVEL BAIXO", desc:"institucional / eleitoral"},
  ACOMPANHAR:{cor:"#57e08a", rot:"ACOMPANHAR",  desc:"serviços / mobilidade / emergência"},
};
const EVENTS = window.SITREP_EVENTS || [];
const META = window.SITREP_META || {};
// cache de geocodificação: parte do arquivo semeado + o que o navegador já resolveu (localStorage)
let CACHE = Object.assign({}, window.SITREP_GEOCACHE || {});
try { Object.assign(CACHE, JSON.parse(localStorage.getItem("sitrep_geocache")||"{}")); } catch(e){}
function saveLocal(){ try{ localStorage.setItem("sitrep_geocache", JSON.stringify(CACHE)); }catch(e){} }

document.getElementById("hmeta").textContent = (META.codigo||"") + " · " + (META.janela||"") + " · " + (META.fonte||"");
document.getElementById("pnote").innerHTML =
  "Atenção <b style='color:var(--green)'>localizada</b>. Violência letal e sinistralidade viária dominam a janela; sem evidência de crise coordenada. "+
  "<span style='color:var(--red)'>Não há base para atribuir os homicídios a facções (PCC, CV, FDN, FTA).</span>";

// mapa
const map = L.map("map",{zoomControl:true,minZoom:3}).setView([-3.11,-60.02], 12);
L.tileLayer("https://tile.openstreetmap.org/{z}/{x}/{y}.png",{
  maxZoom:19, attribution:'&copy; <a href="https://www.openstreetmap.org/copyright">OpenStreetMap</a> contributors'
}).addTo(map);

const cluster = L.markerClusterGroup({maxClusterRadius:38, showCoverageOnHover:false});
map.addLayer(cluster);
let markers = [];

function pinIcon(cor){ return L.divIcon({className:"", html:`<span class="pin" style="--c:${cor}"><b></b><i></i></span>`, iconSize:[20,20], iconAnchor:[10,10]}); }
function osmLinkFor(g){ if(g&&g.link_osm) return g.link_osm; if(g&&g.latitude!=null) return `https://www.openstreetmap.org/?mlat=${g.latitude}&mlon=${g.longitude}#map=15/${g.latitude}/${g.longitude}`; return "https://www.openstreetmap.org/"; }

function popupHTML(ev, g){
  const c = CRIT[ev.criticidade];
  const dt = new Date(ev.data+"T12:00:00").toLocaleDateString("pt-BR");
  const aprox = (g && g.aproximada) ? `<span class="aprox">▲ PRECISÃO APROXIMADA (${g.precisao||"aprox."})</span>` : `<span style="color:var(--dim);font-size:11px">precisão: ${g?g.precisao:"—"}</span>`;
  return `<div class="pop">
     <span class="crit" style="color:${c.cor};border-color:${c.cor}">${c.rot}</span>
     <div class="t">${ev.titulo}</div>
     <div class="m">${dt} · <b>${ev.fonte}</b> · ${ev.zona}</div>
     <div>${ev.resumo}</div>
     <div class="m">${aprox}</div>
     <div style="margin-top:8px">
       <a href="${ev.url}" target="_blank" rel="noopener">Notícia (fonte)</a> ·
       <a href="${osmLinkFor(g)}" target="_blank" rel="noopener">Abrir no OpenStreetMap</a>
     </div></div>`;
}

function rebuild(){
  cluster.clearLayers(); markers = [];
  let plotted = 0, missing = 0;
  for (const ev of EVENTS){
    const g = CACHE[ev.query];
    if (!g || g.latitude==null){ missing++; continue; }   // nunca inventa: sem coord confiável não plota
    const c = CRIT[ev.criticidade];
    const m = L.marker([g.latitude, g.longitude], {icon: pinIcon(c.cor)});
    m.bindPopup(popupHTML(ev,g));
    m.bindTooltip(`${ev.id}. ${ev.titulo}`,{direction:"top",offset:[0,-8]});
    cluster.addLayer(m); markers.push(m); plotted++;
  }
  if (markers.length){ map.fitBounds(L.featureGroup(markers).getBounds().pad(0.18)); }
  document.getElementById("status").textContent = missing ? `${missing} evento(s) sem coordenada confiável — não plotados.` : "";
  renderCounts();
}

function renderCounts(){
  const by = {ALTO:0,MEDIO:0,BAIXO:0,ACOMPANHAR:0};
  EVENTS.forEach(e=>by[e.criticidade]++);
  document.getElementById("counts").innerHTML =
    `<div class="cbox"><div class="n">${EVENTS.length}</div><div class="l">OCORRÊNCIAS</div></div>`+
    `<div class="cbox"><div class="n" style="color:var(--red)">${by.ALTO}</div><div class="l">NÍVEL ALTO</div></div>`;
  document.getElementById("legend").innerHTML = Object.entries(CRIT).map(([k,c])=>
    `<div class="lg"><span class="sw" style="background:${c.cor};color:${c.cor}"></span><b>${c.rot}</b><span class="c">— ${c.desc} · ${by[k]}</span></div>`).join("");
}

document.getElementById("btnFit").onclick = ()=>{ if(markers.length) map.fitBounds(L.featureGroup(markers).getBounds().pad(0.18)); };

// geocodificação ao vivo no navegador (best-effort; o autoritativo é scripts/geocode.mjs)
function classify(r){
  const t=(r.type||"").toLowerCase(), c=(r.class||"").toLowerCase(), at=(r.addresstype||"").toLowerCase();
  if(["house","building","residential"].includes(t)||at==="road"||c==="highway") return {precisao:"endereço/via",aproximada:false};
  if(["suburb","neighbourhood","quarter","city_district"].includes(t)||at==="suburb"||at==="neighbourhood") return {precisao:"bairro",aproximada:false};
  if(["city","town","municipality","administrative"].includes(t)||at==="city"||at==="municipality") return {precisao:"município (aproximada)",aproximada:true};
  return {precisao:"aproximada",aproximada:true};
}
async function geocodeLive(){
  const btn=document.getElementById("btnGeo"), st=document.getElementById("status");
  btn.disabled=true; btn.textContent="CONSULTANDO…";
  const queries=[...new Set(EVENTS.map(e=>e.query))];
  const today=new Date().toISOString().slice(0,10);
  let ok=0,miss=0;
  for(const q of queries){
    const cur=CACHE[q];
    if(cur && cur.fonte==="OpenStreetMap/Nominatim"){ continue; } // não repete consultas já resolvidas
    st.textContent=`Nominatim: ${q}…`;
    try{
      const url=`https://nominatim.openstreetmap.org/search?q=${encodeURIComponent(q)}&format=json&limit=1&countrycodes=br&addressdetails=1`;
      const res=await fetch(url,{headers:{"Accept-Language":"pt-BR"}});
      const arr=await res.json();
      if(Array.isArray(arr)&&arr.length){
        const r=arr[0], p=classify(r);
        CACHE[q]={local_pesquisado:q,nome_retornado:r.display_name,latitude:+r.lat,longitude:+r.lon,
          precisao:p.precisao,aproximada:p.aproximada,data_consulta:today,fonte:"OpenStreetMap/Nominatim",
          osm:{osm_type:r.osm_type,osm_id:r.osm_id,place_id:r.place_id,class:r.class,type:r.type},
          link_osm:(r.osm_type&&r.osm_id)?`https://www.openstreetmap.org/${r.osm_type}/${r.osm_id}`:null,status:"ok"};
        ok++;
      } else { miss++; }
    }catch(e){ st.textContent=`Falha de rede/CORS ao consultar (${q}). Use scripts/geocode.mjs.`; }
    saveLocal(); rebuild();
    await new Promise(r=>setTimeout(r,1100)); // 1 req/s
  }
  st.textContent=`Nominatim concluído: ${ok} atualizado(s)${miss?`, ${miss} sem resultado`:""}.`;
  btn.disabled=false; btn.textContent="ATUALIZAR VIA NOMINATIM";
}
document.getElementById("btnGeo").onclick=geocodeLive;

rebuild();
</script>
</body>
</html>
