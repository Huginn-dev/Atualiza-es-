<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>SITREP Manaus/RMM — Mapa Operacional</title>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.css">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/leaflet.markercluster/1.5.3/MarkerCluster.css">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/leaflet.markercluster/1.5.3/MarkerCluster.Default.css">
<style>
:root{
  --bg0:#04140b; --bg1:#020a06; --green:#57e08a; --dim:#84ae93; --white:#eef6ef;
  --red:#ff4d5e; --amber:#f2b32c; --blue:#5cc8ff; --violet:#c39bff; --line:rgba(90,220,140,.28); --panel:rgba(6,20,12,.94);
}
*{box-sizing:border-box}
html,body{margin:0;height:100%;background:var(--bg1);color:var(--white);
  font-family:'DejaVu Sans Mono',ui-monospace,'Roboto Mono',monospace;font-size:14px}
#app{display:flex;flex-direction:column;height:100%}
header{display:flex;align-items:center;gap:16px;padding:10px 18px;border-bottom:1px solid var(--line);
  background:linear-gradient(180deg,#06180d,#04120a);flex-wrap:wrap}
.brand{font-weight:bold;font-size:20px;letter-spacing:.12em;color:#fff}
.brand .g{color:var(--green)}
.hmeta{color:var(--dim);font-size:12px;letter-spacing:.08em}
.spacer{flex:1}
.attn{border:1px solid var(--green);color:var(--green);font-size:12px;font-weight:bold;padding:5px 10px;letter-spacing:.12em}
.toolbar{display:flex;align-items:center;gap:8px;padding:8px 18px;border-bottom:1px solid var(--line);
  background:#051309;flex-wrap:wrap}
.tsep{width:1px;align-self:stretch;background:var(--line);margin:0 3px}
.tlabel{color:var(--dim);font-size:11px;letter-spacing:.08em}
.chip{border:1px solid var(--line);color:var(--dim);background:transparent;font:inherit;font-size:12px;
  padding:6px 11px;cursor:pointer;border-radius:3px;display:inline-flex;align-items:center;gap:7px}
.chip .sw{width:11px;height:11px;border-radius:50%}
.chip[aria-pressed="true"]{color:#fff;border-color:currentColor}
.chip.alto[aria-pressed="true"]{color:var(--red);box-shadow:0 0 0 1px var(--red) inset}
.chip.medio[aria-pressed="true"]{color:var(--amber);box-shadow:0 0 0 1px var(--amber) inset}
.chip.baixo[aria-pressed="true"]{color:var(--blue);box-shadow:0 0 0 1px var(--blue) inset}
.chip.acomp[aria-pressed="true"]{color:var(--green);box-shadow:0 0 0 1px var(--green) inset}
.chip.indic[aria-pressed="true"]{color:var(--violet);box-shadow:0 0 0 1px var(--violet) inset}
select,input[type=search]{background:#06180d;border:1px solid var(--line);color:var(--white);font:inherit;
  font-size:12px;padding:6px 8px;border-radius:3px}
#fDia{border-color:var(--green);color:#fff}
.btn{background:rgba(87,224,138,.10);border:1px solid var(--green);color:var(--green);font:inherit;
  font-size:12px;font-weight:bold;letter-spacing:.04em;padding:7px 11px;cursor:pointer;border-radius:3px}
.btn:hover{background:rgba(87,224,138,.22)} .btn:focus-visible,.chip:focus-visible{outline:2px solid var(--green);outline-offset:2px}
.btn.sec{border-color:var(--line);color:var(--dim)}
.btn[aria-pressed="true"]{background:var(--green);color:#04140b}
#main{flex:1;display:flex;min-height:0}
#side{width:340px;min-width:340px;border-right:1px solid var(--line);background:var(--panel);
  display:flex;flex-direction:column;overflow:hidden}
#side .note{font-size:12px;color:var(--dim);line-height:1.5;padding:12px 14px;border-bottom:1px solid var(--line)}
#side .note b.red{color:var(--red)}
.hist{font-size:11.5px;color:var(--dim);padding:9px 14px;border-bottom:1px solid var(--line);background:rgba(87,224,138,.04)}
.hist b{color:var(--green)}
.counts{display:flex;flex-wrap:wrap;gap:8px;padding:10px 14px;border-bottom:1px solid var(--line)}
.cbox{flex:1;min-width:52px;border:1px solid var(--line);padding:6px 8px;text-align:center}
.cbox .n{font-size:20px;font-weight:bold} .cbox .l{font-size:10px;color:var(--dim);letter-spacing:.06em}
#list{flex:1;overflow:auto}
.item{display:flex;gap:10px;padding:10px 14px;border-bottom:1px solid rgba(90,220,140,.10);cursor:pointer;
  background:transparent;border-left:3px solid transparent;width:100%;text-align:left;font:inherit;color:inherit}
.item:hover,.item.active{background:rgba(87,224,138,.08);border-left-color:var(--green)}
.item .dot{width:12px;height:12px;border-radius:50%;margin-top:4px;flex:0 0 auto;box-shadow:0 0 8px currentColor}
.item .tt{font-size:12.5px;color:#fff;line-height:1.3}
.item .mm{font-size:11px;color:var(--dim);margin-top:3px}
.daytag{display:inline-block;font-size:9.5px;letter-spacing:.04em;padding:1px 5px;border:1px solid var(--line);
  border-radius:3px;color:var(--dim);margin-left:5px;vertical-align:1px}
.daytag.cur{border-color:var(--green);color:var(--green)}
#mapwrap{flex:1;position:relative;min-width:0}
#map{position:absolute;inset:0;background:#0a1a10}
.attrib{position:absolute;bottom:4px;right:6px;z-index:900;font-size:10.5px;color:#dfe;
  background:rgba(3,10,6,.65);padding:2px 7px;border-radius:3px}
.routebox{position:absolute;top:10px;right:10px;z-index:900;background:var(--panel);border:1px solid var(--line);
  padding:10px 12px;font-size:12px;display:none;min-width:220px}
.routebox.on{display:block}
.routebox .r{color:var(--green);font-weight:bold;margin-top:6px}
/* markers */
.pin{display:block;width:22px;height:22px;position:relative}
.pin i{position:absolute;left:50%;top:50%;width:14px;height:14px;transform:translate(-50%,-50%);
  border-radius:50%;background:var(--c);box-shadow:0 0 10px var(--c);border:2px solid rgba(255,255,255,.9)}
.pin b{position:absolute;left:50%;top:50%;width:30px;height:30px;transform:translate(-50%,-50%);
  border-radius:50%;border:2px solid var(--c);opacity:.5}
.pin.aprox b{border-style:dashed;opacity:.8}
.pin.prev i{opacity:.55} .pin.prev{filter:saturate(.6)}
.leaflet-popup-content-wrapper{background:#06180d;color:var(--white);border:1px solid var(--line);border-radius:6px}
.leaflet-popup-tip{background:#06180d;border:1px solid var(--line)}
.leaflet-popup-content{margin:14px 16px;font-size:13px;line-height:1.5;max-width:290px}
.pop .t{font-weight:bold;color:#fff;font-size:14px;line-height:1.3}
.pop .m{color:var(--dim);font-size:11.5px;margin:6px 0}
.pop .crit{display:inline-block;font-weight:bold;font-size:10.5px;letter-spacing:.06em;padding:2px 8px;border:1px solid;margin-bottom:6px}
.pop .aprox{color:var(--amber);font-weight:bold;font-size:11px}
.pop .ind{color:var(--violet);font-weight:bold;font-size:11px;display:block;margin-top:4px}
.pop .dias{color:var(--dim);font-size:11px;margin-top:6px}
.pop .dias b{color:var(--green)}
.pop a{color:var(--green)}
.marker-cluster div{background:rgba(6,24,13,.9);color:var(--green);font-weight:bold;border:1px solid var(--green)}
.leaflet-bar a{background:#06180d;color:var(--green);border-color:var(--line)}
@media print{ header,.toolbar,#side,.routebox,.leaflet-control-zoom{display:none!important}
  #main{display:block} #mapwrap{position:absolute;inset:0} }
@media(max-width:820px){ #side{position:absolute;z-index:1200;height:60%;bottom:0;left:0;right:0;width:auto;min-width:0;border-top:1px solid var(--line)}
  #main{display:block;height:100%} #mapwrap{position:absolute;inset:0} }
</style>
</head>
<body>
<div id="app">
  <header>
    <div>
      <div class="brand">SITREP <span class="g">MANAUS/RMM</span> · MAPA OPERACIONAL</div>
      <div class="hmeta" id="hmeta"></div>
    </div>
    <div class="spacer"></div>
    <div class="attn" id="attn">ATENÇÃO: LOCALIZADA</div>
  </header>

  <div class="toolbar" role="toolbar" aria-label="Filtros e ações">
    <span class="tlabel">JANELA</span>
    <select id="fDia" aria-label="Filtrar por dia do SITREP"></select>
    <span class="tsep"></span>
    <button class="chip alto"  data-crit="ALTO"       aria-pressed="true"><span class="sw" style="background:#ff4d5e"></span>ALTO</button>
    <button class="chip medio" data-crit="MEDIO"      aria-pressed="true"><span class="sw" style="background:#f2b32c"></span>MÉDIO</button>
    <button class="chip baixo" data-crit="BAIXO"      aria-pressed="true"><span class="sw" style="background:#5cc8ff"></span>BAIXO</button>
    <button class="chip acomp" data-crit="ACOMPANHAR" aria-pressed="true"><span class="sw" style="background:#57e08a"></span>ACOMPANHAR</button>
    <button class="chip indic" data-crit="INDICACAO"  aria-pressed="true"><span class="sw" style="background:#c39bff"></span>INDICAÇÃO</button>
    <select id="fZona" aria-label="Filtrar por zona"><option value="">Todas as zonas</option></select>
    <select id="fFonte" aria-label="Filtrar por fonte"><option value="">Todas as fontes</option></select>
    <input type="search" id="fBusca" placeholder="Buscar bairro/título…" aria-label="Buscar">
    <div class="spacer"></div>
    <button class="btn sec" id="btnTheme" aria-pressed="false">TILES: OSM</button>
    <button class="btn sec" id="btnHeat" aria-pressed="false">HEATMAP</button>
    <button class="btn sec" id="btnRoute" aria-pressed="false">ROTA (OSRM)</button>
    <button class="btn sec" id="btnGeoJSON">GEOJSON</button>
    <button class="btn sec" id="btnCSV">CSV</button>
    <button class="btn sec" id="btnPrint">IMPRIMIR</button>
    <button class="btn" id="btnFit">ENQUADRAR</button>
    <button class="btn" id="btnGeo">NOMINATIM</button>
  </div>

  <div id="main">
    <aside id="side" aria-label="Lista de ocorrências">
      <div class="note" id="pnote"></div>
      <div class="hist" id="hist"></div>
      <div class="counts" id="counts"></div>
      <div id="list" role="list"></div>
      <div class="note" id="foot"></div>
    </aside>
    <div id="mapwrap">
      <div id="map"></div>
      <div class="routebox" id="routebox">
        <b>ROTA RODOVIÁRIA (OSRM)</b>
        <div style="margin-top:8px">Origem <select id="rA"></select></div>
        <div style="margin-top:6px">Destino <select id="rB"></select></div>
        <button class="btn" id="rGo" style="margin-top:8px">TRAÇAR</button>
        <button class="btn sec" id="rClr" style="margin-top:8px">LIMPAR</button>
        <div class="r" id="rOut"></div>
      </div>
      <div class="attrib" id="attrib">© OpenStreetMap contributors</div>
    </div>
  </div>
</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/leaflet.markercluster/1.5.3/leaflet.markercluster.js"></script>

<script>
/* Fallback: se o Leaflet (CDN) não carregar, evita travar o script para a lista continuar funcionando. */
if (typeof L === 'undefined') {
  (function(){
    function mk(){ return new Proxy(function(){return mk();}, {
      get:function(t,p){ if(p==='getLatLng') return function(){return {lat:-3.1,lng:-60.0};};
        if(p==='getBounds') return function(){return {};}; return mk(); },
      apply:function(){ return mk(); } }); }
    window.L=new Proxy(function(){return mk();},{ get:function(){ return function(){return mk();}; }, apply:function(){return mk();} });
    window.addEventListener('DOMContentLoaded',function(){ var m=document.getElementById('map');
      if(m) m.innerHTML='<div style="padding:24px;color:#8bbb9c;font-family:monospace;line-height:1.5">Mapa (Leaflet/OpenStreetMap) indisponível — sem conexão de internet para carregar a biblioteca. A lista de ocorrências à esquerda continua funcional. Abra com internet para ver o mapa.</div>'; });
  })();
}
</script>

<script>

  ALTO:{cor:"#ff4d5e",rot:"NÍVEL ALTO",desc:"violência letal / vítimas fatais",peso:1.0},

  INDICACAO:{cor:"#c39bff",rot:"INDICAÇÃO",desc:"não confirmado — não repassar como fato",peso:0.3},
};
const EVENTS=window.SITREP_EVENTS||[], META=window.SITREP_META||{}, DAYS=window.SITREP_DAYS||[];
const DAY_BY=Object.fromEntries(DAYS.map(d=>[d.dia,d]));
const CUR=META.atual||(DAYS[0]&&DAYS[0].dia)||"";
const rotDia=d=>(DAY_BY[d]&&DAY_BY[d].rotulo)||d;
let CACHE=Object.assign({},window.SITREP_GEOCACHE||{});
try{Object.assign(CACHE,JSON.parse(localStorage.getItem("sitrep_geocache")||"{}"));}catch(e){}
const saveLocal=()=>{try{localStorage.setItem("sitrep_geocache",JSON.stringify(CACHE));}catch(e){}};
const g=q=>{ if(CACHE[q]) return CACHE[q]; const s=(window.SITREP_SEEDS||{})[q]; return s?{latitude:s[0],longitude:s[1],aproximada:true,precisao:"aproximada (semente)",data_consulta:(META.atual||"")}:undefined; };
// dia="" => histórico (todos os dias)
const state={crit:new Set(["ALTO","MEDIO","BAIXO","ACOMPANHAR","INDICACAO"]),dia:"",zona:"",fonte:"",busca:"",active:null,heat:false,route:false};

// ---- filtro por dia ----
const fDia=document.getElementById("fDia");
(function(){ const o=document.createElement("option"); o.value=""; o.textContent="Histórico — todos os dias"; fDia.appendChild(o);
  DAYS.forEach((d,i)=>{const op=document.createElement("option");op.value=d.dia;op.textContent=d.rotulo+(i===0?" (atual)":"");fDia.appendChild(op);}); })();
fDia.value=state.dia;

function refreshHeader(){
  const d=state.dia?DAY_BY[state.dia]:null;
  if(d){ document.getElementById("hmeta").textContent=(d.codigo||"")+" · "+(d.janela||"");
    document.getElementById("attn").textContent="ATENÇÃO: "+(d.atencao||"LOCALIZADA"); }
  else { const cur=DAY_BY[CUR]; document.getElementById("hmeta").textContent="HISTÓRICO ACUMULADO · "+DAYS.length+" janelas · atual "+(cur?cur.codigo:"");
    document.getElementById("attn").textContent="ATENÇÃO: "+((cur&&cur.atencao)||"LOCALIZADA"); }
}
function refreshPnote(){
  const d=state.dia?DAY_BY[state.dia]:DAY_BY[CUR];
  const leitura=(d&&d.leitura)||"Atenção localizada.";
  document.getElementById("pnote").innerHTML=
    "Atenção <b style='color:var(--green)'>localizada</b>. "+leitura+" "+
    "<b class='red'>Não há base para atribuir os homicídios a facções (PCC, CV, FDN, FTA).</b>";
}
function refreshHist(){
  const total=EVENTS.length;
  const perDay=DAYS.map(d=>`<b>${d.rotulo}</b>: ${EVENTS.filter(e=>e.dias.includes(d.dia)).length}`).join(" · ");
  const rep=EVENTS.filter(e=>e.dias.length>1).length;
  document.getElementById("hist").innerHTML=
    `MEMÓRIA · ${total} ocorrências únicas em ${DAYS.length} janelas — ${perDay}`+
    (rep?` · ${rep} reconfirmada(s) entre dias`:"");
}

// ---- mapa + tiles (OSM padrão + CARTO dark, ambos © OSM) ----
const map=L.map("map",{zoomControl:true,minZoom:3}).setView([-3.11,-60.02],12);
const ATTR_OSM='&copy; <a href="https://www.openstreetmap.org/copyright">OpenStreetMap</a> contributors';

let heat=null, routeLine=null, markerById={};

function osmLinkFor(x){ if(x&&x.link_osm)return x.link_osm; if(x&&x.latitude!=null)return `https://www.openstreetmap.org/?mlat=${x.latitude}&mlon=${x.longitude}#map=15/${x.latitude}/${x.longitude}`; return "https://www.openstreetmap.org/"; }

function popupHTML(ev,x){const c=CRIT[ev.criticidade];
  const ap=(x&&x.aproximada)?`<span class="aprox">▲ PRECISÃO APROXIMADA (${x.precisao||"aprox."})</span>`:`<span style="color:var(--dim);font-size:11px">precisão: ${x?x.precisao:"—"}</span>`;

    <div class="t">${ev.titulo}</div><div class="m">${dt(ev.data)} · <b>${ev.fonte}</b> · ${ev.zona}</div>
    <div>${ev.resumo}</div>${ind}<div class="m">${ap}</div>${diasHTML(ev)}
    <div style="margin-top:8px"><a href="${ev.url}" target="_blank" rel="noopener">Notícia (fonte)</a> · <a href="${osmLinkFor(x)}" target="_blank" rel="noopener">Abrir no OpenStreetMap</a></div></div>`;
}
function inDay(ev){ return !state.dia || ev.dias.includes(state.dia); }
function visible(ev){ if(!state.crit.has(ev.criticidade))return false;
  if(!inDay(ev))return false;
  if(state.zona && ev.zona!==state.zona)return false;
  if(state.fonte && ev.fonte!==state.fonte)return false;
  if(state.busca){const s=(ev.titulo+" "+ev.zona+" "+ev.resumo+" "+ev.query).toLowerCase(); if(!s.includes(state.busca))return false;}
  return true; }
// evento de janela anterior que NÃO está no dia atual (memória)
function isPrev(ev){ return !ev.dias.includes(CUR); }

function rebuild(){
  cluster.clearLayers(); markerById={}; const pts=[]; let missing=0; const bounds=[];
  for(const ev of EVENTS){ if(!visible(ev))continue; const x=g(ev.query); if(!x||x.latitude==null){missing++;continue;}
    const c=CRIT[ev.criticidade];
    const m=L.marker([x.latitude,x.longitude],{icon:pinIcon(c.cor,x.aproximada,isPrev(ev)),keyboard:true,title:`${ev.id}. ${ev.titulo}`});
    m.bindPopup(popupHTML(ev,x)); m.on("click",()=>setActive(ev.id));
    cluster.addLayer(m); markerById[ev.id]=m; bounds.push([x.latitude,x.longitude]);
    pts.push([x.latitude,x.longitude,c.peso]);
  }
  if(heat){map.removeLayer(heat);heat=null;} if(state.heat&&pts.length){heat=L.heatLayer(pts,{radius:34,blur:22,maxZoom:14}).addTo(map);}
  if(bounds.length){map.fitBounds(bounds,{padding:[40,40]});}
  renderList(); renderCounts(missing);
}
function renderCounts(missing){ const by={ALTO:0,MEDIO:0,BAIXO:0,ACOMPANHAR:0,INDICACAO:0}; let vis=0, tot=0;
  EVENTS.forEach(e=>{ if(!inDay(e))return; tot++; by[e.criticidade]++; if(visible(e))vis++;});
  document.getElementById("counts").innerHTML=
    `<div class="cbox"><div class="n">${vis}/${tot}</div><div class="l">EXIBIDAS</div></div>`+
    Object.entries(CRIT).map(([k,c])=>`<div class="cbox"><div class="n" style="color:${c.cor}">${by[k]}</div><div class="l">${k==="INDICACAO"?"INDIC.":k}</div></div>`).join("");
  const dts=Object.values(CACHE).map(x=>x&&x.data_consulta).filter(Boolean).sort();
  document.getElementById("foot").innerHTML=`Geocode: OpenStreetMap/Nominatim · atualização: ${dts.length?dts[dts.length-1]:"—"}<br><b>© OpenStreetMap contributors</b>`+(missing?`<br><span style="color:var(--amber)">${missing} sem coord. confiável (não plotado)</span>`:"");
}
function renderList(){ const wrap=document.getElementById("list"); wrap.innerHTML="";
  EVENTS.filter(visible).forEach(ev=>{ const c=CRIT[ev.criticidade]; const x=g(ev.query);
    const b=document.createElement("button"); b.className="item"+(state.active===ev.id?" active":""); b.setAttribute("role","listitem");
    const tags=ev.dias.slice().sort().reverse().map(d=>`<span class="daytag ${d===CUR?'cur':''}">${rotDia(d)}</span>`).join("");
    b.innerHTML=`<span class="dot" style="background:${c.cor};color:${c.cor}"></span><span><span class="tt">${ev.titulo}${tags}</span><span class="mm">${dt(ev.data)} · ${ev.fonte} · ${ev.zona}${(x&&x.aproximada)?" · ~aprox":""}</span></span>`;
    b.onclick=()=>{ setActive(ev.id); const m=markerById[ev.id]; if(m){ const ll=m.getLatLng(); map.flyTo(ll,15,{duration:.6}); cluster.zoomToShowLayer(m,()=>m.openPopup()); } };
    wrap.appendChild(b);
  });
}
function setActive(id){ state.active=id; document.querySelectorAll(".item").forEach(el=>el.classList.remove("active"));
  renderList(); }

// ---- filtros ----
document.querySelectorAll(".chip[data-crit]").forEach(ch=>ch.onclick=()=>{ const k=ch.dataset.crit;
  if(state.crit.has(k)){state.crit.delete(k);ch.setAttribute("aria-pressed","false");}else{state.crit.add(k);ch.setAttribute("aria-pressed","true");}
  rebuild(); });
fDia.onchange=e=>{ state.dia=e.target.value; refreshHeader(); refreshPnote(); rebuild(); };
function fillSelect(id,vals){const s=document.getElementById(id);[...new Set(vals)].sort().forEach(v=>{const o=document.createElement("option");o.value=v;o.textContent=v;s.appendChild(o);});}
fillSelect("fZona",EVENTS.map(e=>e.zona)); fillSelect("fFonte",EVENTS.map(e=>e.fonte));
document.getElementById("fZona").onchange=e=>{state.zona=e.target.value;rebuild();};
document.getElementById("fFonte").onchange=e=>{state.fonte=e.target.value;rebuild();};
document.getElementById("fBusca").oninput=e=>{state.busca=e.target.value.trim().toLowerCase();rebuild();};

// ---- ações ----
document.getElementById("btnFit").onclick=()=>{const b=Object.values(markerById).map(m=>m.getLatLng());if(b.length)map.fitBounds(b,{padding:[40,40]});};
document.getElementById("btnTheme").onclick=()=>setTheme(!dark);
document.getElementById("btnHeat").onclick=()=>{state.heat=!state.heat;document.getElementById("btnHeat").setAttribute("aria-pressed",state.heat);rebuild();};
document.getElementById("btnPrint").onclick=()=>window.print();

// export (respeita o filtro de dia atual)
function features(){return EVENTS.filter(inDay).map(ev=>{const x=g(ev.query);if(!x||x.latitude==null)return null;
  return {type:"Feature",geometry:{type:"Point",coordinates:[x.longitude,x.latitude]},
    properties:{id:ev.id,titulo:ev.titulo,data:ev.data,fonte:ev.fonte,zona:ev.zona,criticidade:ev.criticidade,
      dias:ev.dias.join("|"),indicacao:!!ev.indicacao,resumo:ev.resumo,url:ev.url,precisao:x.precisao,aproximada:x.aproximada,osm:x.link_osm}};}).filter(Boolean);}
function download(name,txt,mime){const a=document.createElement("a");a.href=URL.createObjectURL(new Blob([txt],{type:mime}));a.download=name;a.click();URL.revokeObjectURL(a.href);}
document.getElementById("btnGeoJSON").onclick=()=>download("sitrep-ocorrencias.geojson",JSON.stringify({type:"FeatureCollection",features:features()},null,2),"application/geo+json");
document.getElementById("btnCSV").onclick=()=>{const rows=[["id","titulo","data","fonte","zona","criticidade","dias","indicacao","lat","lon","precisao","aproximada","url"]];
  EVENTS.filter(inDay).forEach(ev=>{const x=g(ev.query);rows.push([ev.id,ev.titulo,ev.data,ev.fonte,ev.zona,ev.criticidade,ev.dias.join("|"),ev.indicacao?"sim":"",x?x.latitude:"",x?x.longitude:"",x?x.precisao:"",x?x.aproximada:"",ev.url]);});
  download("sitrep-ocorrencias.csv","﻿"+rows.map(r=>r.map(c=>`"${String(c??"").replace(/"/g,'""')}"`).join(";")).join("\n"),"text/csv");};

// ---- rota OSRM ----
function fillRoute(){["rA","rB"].forEach(id=>{const s=document.getElementById(id);s.innerHTML="";
  EVENTS.filter(inDay).forEach(ev=>{const x=g(ev.query);if(!x||x.latitude==null)return;const o=document.createElement("option");o.value=ev.id;o.textContent=`${ev.id}. ${ev.zona}`;s.appendChild(o);});});
  const s=document.getElementById("rB"); if(s.options.length>1)s.selectedIndex=s.options.length-1;}
document.getElementById("btnRoute").onclick=()=>{state.route=!state.route;document.getElementById("routebox").classList.toggle("on",state.route);document.getElementById("btnRoute").setAttribute("aria-pressed",state.route);if(state.route)fillRoute();};
document.getElementById("rClr").onclick=()=>{if(routeLine){map.removeLayer(routeLine);routeLine=null;}document.getElementById("rOut").textContent="";};
document.getElementById("rGo").onclick=async()=>{
  const a=g(EVENTS.find(e=>e.id==+document.getElementById("rA").value).query), b=g(EVENTS.find(e=>e.id==+document.getElementById("rB").value).query);
  if(!a||!b||a.latitude==null||b.latitude==null){document.getElementById("rOut").textContent="Sem coordenada para um dos pontos.";return;}
  document.getElementById("rOut").textContent="Consultando OSRM…";
  try{const url=`https://router.project-osrm.org/route/v1/driving/${a.longitude},${a.latitude};${b.longitude},${b.latitude}?overview=full&geometries=geojson`;
    const r=await fetch(url); const j=await r.json();
    if(!j.routes||!j.routes.length){document.getElementById("rOut").textContent="Rota não encontrada.";return;}
    const rt=j.routes[0]; if(routeLine)map.removeLayer(routeLine);
    routeLine=L.geoJSON(rt.geometry,{style:{color:"#57e08a",weight:4,opacity:.9,dashArray:"6 6"}}).addTo(map);
    map.fitBounds(routeLine.getBounds(),{padding:[40,40]});
    document.getElementById("rOut").innerHTML=`Distância: <b>${(rt.distance/1000).toFixed(1)} km</b><br>Tempo estimado: <b>${Math.round(rt.duration/60)} min</b>`;
  }catch(e){document.getElementById("rOut").textContent="Falha ao consultar OSRM (rede/CORS). Rode via servidor local.";}
};

// ---- geocode ao vivo (best-effort; autoritativo é scripts/geocode.mjs) ----
function classify(r){const t=(r.type||"").toLowerCase(),c=(r.class||"").toLowerCase(),at=(r.addresstype||"").toLowerCase();
  if(["house","building","residential"].includes(t)||at==="road"||c==="highway")return{precisao:"endereço/via",aproximada:false};
  if(["suburb","neighbourhood","quarter","city_district"].includes(t)||at==="suburb"||at==="neighbourhood")return{precisao:"bairro",aproximada:false};
  if(["city","town","municipality","administrative"].includes(t)||at==="city"||at==="municipality")return{precisao:"município (aproximada)",aproximada:true};
  return{precisao:"aproximada",aproximada:true};}
document.getElementById("btnGeo").onclick=async function(){ const btn=this; btn.disabled=true; const old=btn.textContent;
  const qs=[...new Set(EVENTS.map(e=>e.query))], today=new Date().toISOString().slice(0,10); let ok=0;
  for(const q of qs){ const cur=CACHE[q]; if(cur&&cur.fonte==="OpenStreetMap/Nominatim")continue; btn.textContent="…"+q.slice(0,10);
    try{const url=`https://nominatim.openstreetmap.org/search?q=${encodeURIComponent(q)}&format=json&limit=1&countrycodes=br&addressdetails=1`;
      const arr=await (await fetch(url,{headers:{"Accept-Language":"pt-BR"}})).json();
      if(Array.isArray(arr)&&arr.length){const r=arr[0],p=classify(r);
        CACHE[q]={local_pesquisado:q,nome_retornado:r.display_name,latitude:+r.lat,longitude:+r.lon,precisao:p.precisao,aproximada:p.aproximada,
          data_consulta:today,fonte:"OpenStreetMap/Nominatim",osm:{osm_type:r.osm_type,osm_id:r.osm_id,place_id:r.place_id,class:r.class,type:r.type},
          link_osm:(r.osm_type&&r.osm_id)?`https://www.openstreetmap.org/${r.osm_type}/${r.osm_id}`:null,status:"ok"};ok++;}
    }catch(e){}
    saveLocal(); rebuild(); await new Promise(r=>setTimeout(r,1100)); }
  btn.disabled=false; btn.textContent=old; };

refreshHeader(); refreshPnote(); refreshHist();
try{ setTheme(false); rebuild(); }
catch(err){ console.error("mapa indisponível:",err);
  try{ renderList(); renderCounts(0); }catch(e){}
  var mp=document.getElementById("map"); if(mp){ mp.innerHTML="<div style=\"padding:24px;color:#8bbb9c;font-family:monospace\">Mapa indisponível (sem conexão para carregar Leaflet/OSM). A lista de ocorrências à esquerda continua funcional.</div>"; } }
</script>
